name: Release

# Push a tag like "v1.0.0" to build CoverCraftSetup.exe (and the raw
# CoverCraft.exe) and publish them as a GitHub Release, with auto-generated
# release notes from the commits/PRs since the last tag. Can also be run
# manually from the Actions tab.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build CoverCraft.exe
        run: pyinstaller --onefile --noconsole --name CoverCraft --icon assets\icon.ico --add-data "assets\icon.ico;assets" gui.py

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build CoverCraftSetup.exe installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          if ($version -eq "${{ github.ref_name }}" -and $version -notmatch '^\d') {
            $version = "0.0.0-dev"  # workflow_dispatch on a branch, not a version tag
          }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\CoverCraft.iss "/DMyAppVersion=$version"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/CoverCraftSetup.exe
            dist/CoverCraft.exe
