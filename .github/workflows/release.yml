name: Release

# Push a tag like "v1.0.0" to build CoverCraftSetup.msi and publish it as a
# GitHub Release (with auto-generated release notes from the commits/PRs
# since the last tag). Can also be run manually from the Actions tab.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Sets $env:pythonLocation, which scripts\build-portable.ps1 uses as
      # the source for the private Python runtime bundled into the MSI.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install WiX Toolset
        run: |
          dotnet tool install --global wix
          wix eula accept wix7

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            $version = "0.0.0"  # workflow_dispatch on a branch, not a version tag
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build CoverCraftSetup.msi
        shell: pwsh
        run: scripts\build-msi.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/CoverCraftSetup.msi
