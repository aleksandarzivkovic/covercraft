name: Release

# Push a tag like "v1.0.0" to build CoverCraft.exe and publish it as a GitHub
# Release (with auto-generated release notes from the commits/PRs since the
# last tag). Can also be run manually from the Actions tab.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build CoverCraft.exe
        run: pyinstaller --onefile --noconsole --name CoverCraft gui.py

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/CoverCraft.exe
